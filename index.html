<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d6efd">
<title>智能盤點系統</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<!-- 引入 Fuse.js 用於 AI 模糊匹配 -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body>

<header class="topbar">
  <div>
    <div class="title">智能盤點</div>
    <div class="sub" id="topSub">—</div>
  </div>
  <div class="net" id="netState">●</div>
</header>

<main>
  <!-- ===== 1. 錄音輸入頁 ===== -->
  <section id="view-voice" class="view active">
    <div class="panel">
      <button id="btnBigVoice" class="btn-record">
        <span class="icon">🎤</span>
        <span class="text">撳住講：貨名 + 數量</span>
      </button>
      <div id="voicePanel" class="voice-panel" style="display:none">
        <div class="voice-text" id="voiceText">聆聽中…</div>
        <button id="btnVoiceStop" class="btn-stop">完成</button>
      </div>
    </div>

    <div class="list-title">
      <span>待確認記錄</span>
      <span id="pendingBadge" class="badge">0</span>
    </div>
    <div id="pendingList" class="list"></div>
  </section>

  <!-- ===== 2. 貨品清單 ===== -->
  <div class="toolbar">
      <button id="btnImport" class="btn-primary">匯入貨品清單 (CODE / 名稱)</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">
      <button id="btnClearCatalog" class="btn-danger">清空清單</button>
    </div>
    
    <!-- 新增貨物表單 -->
    <div class="panel" style="display:flex; gap:8px; margin-bottom:10px; padding:10px; background:#fff; border-radius:8px;">
      <input type="text" id="newItemCode" placeholder="CODE (選填)" style="flex:1; padding:10px; border:1px solid #dfe3e8; border-radius:6px;">
      <input type="text" id="newItemName" placeholder="貨品名稱 (必填)" style="flex:2; padding:10px; border:1px solid #dfe3e8; border-radius:6px;">
      <button id="btnAddItem" class="btn-primary" style="padding:0 15px; border-radius:6px; white-space:nowrap;">新增</button>
    </div>

    <div class="stat" id="catalogStat">未匯入清單</div>
    
    <!-- 搜尋框 -->
    <div class="searchbar" style="margin-top: 10px; margin-bottom: 10px;">
      <input id="catalogSearch" type="text" placeholder="🔍 搜尋 CODE 或 貨名..." autocomplete="off" style="background:#fff; border:2px solid #0d6efd;">
    </div>
  </section>

  <!-- ===== 3. 確認與導出 ===== -->
  <section id="view-report" class="view">
    <div class="toolbar">
      <button id="btnExport" class="btn-primary">確認並導出 Excel</button>
      <button id="btnClearAll" class="btn-secondary">清空記錄</button>
    </div>
    <div class="stat" id="reportStat"></div>
    <div id="reportList" class="list"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="view-voice" class="active">🎤 錄音</button>
  <button data-view="view-catalog">📦 貨品清單</button>
  <button data-view="view-report">📊 確認導出</button>
</nav>

<div id="toast" class="toast"></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
